name: numbia
description: "NUMBAA - Plateforme de communication digitale pour les petites entreprises."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.1.0
  go_router: ^15.1.2
  get_it: ^8.0.3
  shared_preferences: ^2.5.3
  google_fonts: ^6.2.1
  equatable: ^2.0.7
  image_picker: ^1.1.2
  uuid: ^4.5.1
  intl: ^0.20.2
  http: ^1.2.2
  flutter_secure_storage: ^9.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/mock/
